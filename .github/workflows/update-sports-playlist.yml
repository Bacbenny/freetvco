name: Update Sports IPTV playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate playlist
        run: node scripts/generate-sports-highfly.mjs

      - name: Commit changed playlist
        run: |
          if git diff --quiet -- sports-highfly.m3u; then
            echo "Playlist is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sports-highfly.m3u
          git commit -m "chore: update sports IPTV playlist"
          git push